</div>

</div>

<span class="">Continue to Checkout</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('main-action-btn');
            const viewCart = document.getElementById('view-cart');
            const viewCheckout = document.getElementById('view-checkout');
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const progressBar = document.getElementById('progress-bar');
            
            let isCheckout = false;

            btn.addEventListener('click', () => {
                if (!isCheckout) {
                    // Transition to Checkout
                    viewCart.classList.add('-translate-x-full');
                    viewCart.classList.remove('block');
                    setTimeout(() => {
                        viewCart.classList.add('hidden');
                        viewCheckout.classList.remove('hidden');
                        // Small delay to allow display:block to apply before transition
                        setTimeout(() => {
                            viewCheckout.classList.remove('translate-x-full');
                        }, 50);
                    }, 500);

                    // Update Progress Indicator
                    step1.classList.remove('active');
                    step1.classList.add('completed');
                    
                    // Update Step 1 styling to completed state
                    const s1Circle = step1.querySelector('.step-circle');
                    s1Circle.innerHTML = '<span class="material-symbols-outlined" style="font-size: 16px;">check</span>';
                    s1Circle.classList.remove('bg-primary', 'border-primary', 'text-on-primary');
                    s1Circle.classList.add('bg-tertiary', 'border-tertiary', 'text-on-tertiary');

                    step2.classList.add('active');
                    
                    // Update Step 2 styling to active state
                    const s2Circle = step2.querySelector('.step-circle');
                    s2Circle.classList.remove('bg-surface', 'border-primary-fixed', 'text-primary-fixed', 'bg-white');
                    s2Circle.classList.add('bg-primary', 'border-primary', 'text-on-primary');
                    
                    const s2Text = step2.querySelector('span');
                    s2Text.classList.remove('text-on-surface-variant');
                    s2Text.classList.add('text-primary', 'font-bold');

                    progressBar.style.width = '100%';

                    // Update Button
                    btn.innerHTML = '<span>Place Order</span><span class="material-symbols-outlined">check_circle</span>';
                    btn.classList.remove('bg-primary');
                    btn.classList.add('bg-tertiary');
                    
                    isCheckout = true;
                } else {
                    // Place Order Action (Demo)
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Processing...</span>';
                    btn.classList.add('opacity-80');
                    setTimeout(() => {
                        btn.innerHTML = '<span>Order Confirmed</span><span class="material-symbols-outlined">celebration</span>';
                        btn.classList.remove('bg-tertiary', 'opacity-80');
                        btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                    }, 1500);
                }
            });
        });
    </script>
